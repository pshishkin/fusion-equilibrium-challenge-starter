# One preregistered matched raw-versus-low-pass waveform information gate.
# This fits three small residual heads only; it is not a production sequence model.
model:
  conv_channels: 64
  kernel_size: 5
  stride: 2
  embedding_size: 32
  hidden_sizes: [256, 256]
  activation: gelu
  zero_output_init: true
train:
  batch_size: 1024
  max_steps: 4000
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip: 1.0
  log_every_steps: 500
  torch_threads: 4
  device: cuda
