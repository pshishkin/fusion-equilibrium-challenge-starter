# Model zoo for my_experiments/train.py. Every hyper-parameter lives here and nowhere else —
# the code has no defaults to fall back on, so a value read from this file is the value used.
#
# What is NOT here: how the targets are scaled. That one is fixed in code
# (my_experiments/models.py::TargetScaler) because the metric fixes it — see README.
#
#   uv run python my_experiments/train_eval.py 0.01 0.01 0.002
#
# Unknown keys are an error, not a shrug: a mistyped hyper-parameter that is silently ignored
# looks exactly like one that did not help. See AGENTS.md, "Fail fast, never quietly repair".

features:
  # PCA components of psi(R,Z). Every model regresses these plus q95 and betaN — 50 components
  # reconstruct the flux map to ~100% of its variance, so the ceiling is the regression, not the
  # compression.
  n_pca: 50
  # sklearn picks the randomized SVD solver for 50 components out of 4225 pixels, and
  # experiments.TargetPCA leaves random_state at None. Unpinned, two runs on the same shots fit
  # different components, so every model gets different targets and the score moves: the torch MLP
  # scored 0.6769 and 0.6846 on the same 7 shots before this was pinned.
  pca_seed: 0

  # Frames the PCA is FITTED on, as a share of the training frames. It is only an estimate of 50
  # directions in a 4225-dimensional space, and neighbouring EFIT frames are 20 ms apart and nearly
  # duplicates, so the sample does not have to be every frame — while the randomized SVD's centred
  # copy of the flux array is the memory peak of that stage. Everything is still TRANSFORMED with
  # every frame; this only thins what the components are estimated from.
  # Thinning is a stride, not a draw (see thin_frames): it covers ramp-up, flat-top and ramp-down.
  pca_frame_share: 1.0

  # psi = psi_coil + psi_plasma, and the first term is a Green's function times a current rather
  # than a modelling problem — see README, "The flux decomposition". With this on, the models are
  # fitted on the plasma part alone and the coil part is added back, unchanged, at inference. The
  # split is exact whatever the gains are, so this cannot lose accuracy by itself; what it changes
  # is what the regression has to represent.
  subtract_coil_field: true

  # What the models see.
  #   currents   the 21 shipped magnetics signals — the baseline
  #   coil_pca   the flux the 19 coils with a rectangle produce, in its own principal directions,
  #              plus the signals that have NO rectangle and so cannot appear in it
  #              (plasma_current, and bcoil, which is toroidal and drives no poloidal flux)
  #   both       the two concatenated
  # `coil_pca` carries the same information as `currents` — the coil flux is linear in them — but
  # in machine-independent coordinates, which is the form MAST will need, where DIII-D's 21 columns
  # do not exist. On DIII-D the question it answers is only "does this cost anything".
  inputs: currents

  # Rates, not levels. The net sees one frame of 21 instantaneous numbers and cannot differentiate
  # them, so every quantity whose physical role is a RATE is absent from its inputs however well
  # the level is represented. dI_sol/dt is the loop voltage — the thing that actually drives the
  # plasma current, where I_sol itself drives nothing — and it correlates -0.665 with dIp/dt
  # against +0.515 for the level, so the derivative carries the relationship and the level dilutes
  # it. dIp/dt separates ramp-up, flat-top and ramp-down, which have different current profiles.
  #
  #   none     the 21 levels alone — the baseline every number so far was measured on
  #   raw      + d/dt of each signal on ITS OWN 0.05 ms time base, then interpolated to the frames
  #   interp   + d/dt of the interpolated series, at the 20 ms frame spacing
  #   both     + all 42 columns
  #
  # `raw` and `interp` are not a right and a wrong way, they are two physical timescales: one is
  # the rate the coil supply actually produced, the other the rate the equilibrium had time to
  # respond to. Both blocks are ALWAYS computed and cached, so switching arms costs a training run
  # and not a rebuild of the 25 GB shot cache.
  derivatives: none
  # Which signals get one. `driving` is the two the physics names — ECOILA, whose dI/dt IS the loop
  # voltage, and plasma_current, whose dIp/dt separates the ramp phases. `poloidal` is every signal
  # that produces poloidal flux, i.e. all but `bcoil`, which is toroidal and cannot inform psi at
  # all. Taking all twenty-one tests a weaker claim than the one that was argued for, so `driving`
  # is the sharp arm and `poloidal` the broad one.
  derivative_signals: driving

  # Thomson scattering, as twelve numbers per frame. Pressure is one of the two free functions of
  # Grad-Shafranov and the one quantity the magnetics cannot see. The geometry decides what is
  # computable: the CORE system is a vertical chord (44 channels at R = 1.940, varying Z) and the
  # EDGE one is a horizontal cut across the outboard edge (10 channels at Z ~ -0.06, R 1.68..2.06),
  # so the radial derivative the equation actually asks for exists on the edge system — and lands
  # on the pedestal. Six summaries per system: peak, where the peak is, the line integral of Te and
  # Five summaries per system: peak, where the peak is, the line integrals of Te and of the
  # pressure, and the least-squares slope along the chord.
  #
  # Missing samples are exact ZEROS in this dataset, not nan, so every reduction runs on a mask.
  thomson: "te,ne,p,pos"
  # At most 19: the coil flux spans one dimension per current column and no more.
  n_coil_pca: 19

split:
  # Which shots land in the training, validation and scoring windows. The shares stay the same;
  # the salt only reshuffles who is where, by hashing "<salt>:<shot id>" instead of the bare id.
  #
  # This is the replicate that matters. The MLP seed varies only the optimisation; the salt varies
  # the DATA, and "does this change help" is a claim about new shots, not about these 352. Compare
  # configurations PAIRED within a salt and read the spread across salts as the uncertainty of the
  # effect — never compare absolute scores between salts, the scored shots differ.
  #
  # 0 hashes the bare filename and is therefore the split every number in README was measured on.
  # Keep it for headline figures.
  salt: 0

loss:
  # Which errors of the flux map the loss is allowed to care about — see
  # my_experiments/target_metric.py. The models regress PCA coefficients and the decoder is
  # affine, so any quadratic functional of the map error is a fixed matrix on those coefficients.
  #
  # Consistency and D_LCFS are 30% of the composite and where the score is actually lost, and
  # neither reads the map's VALUES — they read its geometry. The magnetic axis sits where grad psi
  # vanishes, so psi is flat there and an error R2_psi cannot see moves the axis a long way.
  #
  #   parseval  the pixel error of the map — exactly R2_psi, and nothing else. Kept as the CONTROL
  #             every claim in README is measured against, and as the fallback for a machine whose
  #             functionals the probe below cannot evaluate.
  #   jacobian  measure how the seven scored functionals respond to each coefficient and build the
  #             metric from the competition's own weights. No knob: the loss becomes
  #             W_PSI * R2_psi + (W_CONS/7) * sum_j R2_j, which is Consistency entering the loss
  #             for the first time. The psi block's share of the loss grows, and should.
  #
  # A third mode, `field`, moved a hand-set share of the psi budget onto the poloidal-field error.
  # It is gone. It did its job — it showed the effect was real (+0.0059 at its best against +0.0117
  # for `jacobian`) — but its optimum was a flat plateau from 0.01 to 0.1, so the data could say
  # that some field weighting helps and never how much. That is the argument for measuring the
  # metric instead of tuning it. `target_metric.poloidal_field_form` stays: li is exactly <B_p^2>
  # and deserves that exact form rather than a linearisation.
  metric: jacobian

  # `jacobian` only. Frames probed, and the size of the probe. The probe is ISOTROPIC — the same
  # step for every coefficient, because on an orthonormal basis that is the same size of flux
  # error whichever component it is — and it is measured in units of the per-frame flux spread,
  # sqrt(psi_ss_tot / n_pca). It has to sit near the errors the model actually makes: these
  # functionals extract a contour and a sub-pixel maximum, so a derivative taken at an
  # infinitesimal step describes a regime the model never occupies. 0.05 is ~ the model's own
  # relative flux error at R2_psi = 0.997.
  # `jacobian` only. Divide each scalar's block in M by how badly its own linearisation misses.
  # The per-component differences say how each direction acts alone; whether their sum still
  # describes reality when every coefficient is wrong at once is a different question, and random
  # full-vector probes on the same frames answer it. Measured on a trained model the Jacobian
  # over-states `li` by 1.65x and `tri_bot` by 1.51x, and an over-stated sensitivity is an
  # over-weighted scalar. No new input: the ratio comes from the probe, not from a model.
  calibrate_scalars: false

  jacobian_frames: 300
  jacobian_delta: 0.0332

  # `jacobian` only. Add the BOUNDARY term: how far the plasma boundary moves when the
  # coefficients are wrong. A flux error displaces a level set along its normal by
  # dpsi / |grad psi|, which is linear in the error and so is one more fixed matrix.
  #
  # It supplies what the Jacobian structurally cannot. D_LCFS is a distance — zero at the ground
  # truth, so a central difference sees no derivative and the loss has never contained it. And
  # kappa/volume/tri ARE in the Jacobian, but as four scalar summaries of a 512-point curve; they
  # cannot express a rigid shift or a local dimple. Its weight comes from W_LCFS and from the
  # displacement the probe itself produces, so it adds no knob.
  #
  # Honest limit: D_LCFS is a symmetric HAUSDORFF distance, a maximum over the contour, and this
  # is a mean square. A surrogate for that term, not that term.
  boundary: false

models:
  ridge:
    type: ridge
    enabled: true
    alpha: 1.0

  catboost:
    type: catboost
    # Measured at production on 2026-08-14 and switched back off: 3829 s to fit against 296 s
    # for one MLP, it scores 0.9838 alone against 0.9875-0.9885, and adds +0.0002 to the
    # ensemble. It did not even converge — 'best iteration 7999 of 8000'.
    enabled: false

    # One MultiRMSE model over all n_pca + 2 outputs, not one model per output: gradient boosting
    # with a shared tree structure and vector leaves. Targets are standardized inside the wrapper,
    # otherwise the first PCA component (variance ~1e10) is the only thing the loss can see.
    # `iterations` is a ceiling, not a target: set it far above anything the fit should need and
    # let the validation split decide. At 70 training shots it stops itself around 2142 and keeps
    # iteration 1942, so the ceiling costs nothing; with more shots the optimum moves and the fit
    # is free to follow it.
    iterations: 8000
    depth: 8
    learning_rate: 0.1
    l2_leaf_reg: 3.0
    # Generous on purpose: the validation curve is noisy, and a patience of 50 fired on a plateau
    # at iteration 548, costing 0.7439 -> 0.7392. 0 turns early stopping off entirely — trains the
    # full ceiling and keeps its LAST iteration, which is the control this feature has to beat.
    early_stopping_rounds: 50
    random_seed: 0
    thread_count: 8

  mlp:
    type: torch_mlp
    enabled: true
    # The sklearn MLPRegressor of experiments.py, rewritten in torch so the training loop is ours:
    # a plain fully-connected net on the 21 magnetics features, CPU, standardized targets.
    hidden_sizes: [512, 512]
    # A ceiling plus the patience that ends the run first (686 epochs of 2000, best at 585). The
    # weights kept are the best epoch on the validation split, not the last one reached.
    #
    # Patience is 100 rather than 20 because the validation curve has a false floor: with 20 this
    # net stopped at epoch 27, keeping epoch 6 — 192 Adam steps, undertrained by construction —
    # and scored 0.5521 where the patient version scores 0.7273 on the same shots. An epoch here
    # is only 32 minibatches, so patience in epochs is a much shorter leash than it sounds.
    # 0 turns early stopping off entirely.
    epochs: 2000
    patience: 100
    batch_size: 512
    learning_rate: 0.001
    weight_decay: 0.0
    seed: 0
    # Threads for torch, and not one per core: this net is 21 -> 256 -> 256 -> 52, so a batch is
    # too small to feed 20 threads and the synchronization dominates. Measured on 10k frames,
    # per epoch: 1 thread 0.064 s, 4 threads 0.040 s, 20 threads 0.351 s.
    threads: 4
    device: cuda
    # Architecture, all handed to models.build_mlp. The OUTPUT layer is always linear and is not a
    # setting: the targets are scaled PCA coefficients with unbounded range, so a squashing head
    # would cap the tails of the distribution being regressed.
    #   relu  the baseline every number before 2026-08-14 was measured on
    #   gelu / silu  nonzero derivative on the negative side, so a dead unit can recover
    activation: relu
    # Share of hidden units zeroed during training. 0.0 is off. The measured train/val gap on the
    # production screen is 3.4x (train 0.0192, val 0.0650 at epoch 625), so there IS something here
    # to regularise — and `weight_decay` above, still 0.0, is the cheaper way to try first.
    dropout: 0.0
    # Batch norm on the hidden pre-activations. It changes the convergence badly enough that it
    # cannot be screened at the learning rate tuned without it — sweep the two JOINTLY or the
    # result is a statement about the rate, not about the normalisation.
    batch_norm: false
    # `none` is the constant rate everything so far was measured at. `cosine` decays to
    # learning_rate * lr_final_factor over the EPOCH CEILING, not over the epoch early stopping
    # reaches — a schedule whose shape depends on its own outcome is a feedback loop, not a setting.
    lr_schedule: none
    lr_final_factor: 0.01
    # Epochs the schedule spans; 0 = use `epochs`. `epochs` is a CEILING set far above any real
    # fit, so leaving this at 0 makes a cosine traverse only its flat first quarter — measured, it
    # cut the rate by 16% over a 533-epoch run and called itself an annealing schedule. Set it near
    # where the fit actually ends.
    lr_t_max: 0

  mlp1:
    type: torch_mlp
    enabled: true
    hidden_sizes: [512, 512]
    epochs: 2000
    patience: 100
    batch_size: 512
    learning_rate: 0.001
    weight_decay: 0.0
    seed: 1
    threads: 4
    device: cuda
    # Architecture, all handed to models.build_mlp. The OUTPUT layer is always linear and is not a
    # setting: the targets are scaled PCA coefficients with unbounded range, so a squashing head
    # would cap the tails of the distribution being regressed.
    #   relu  the baseline every number before 2026-08-14 was measured on
    #   gelu / silu  nonzero derivative on the negative side, so a dead unit can recover
    activation: relu
    # Share of hidden units zeroed during training. 0.0 is off. The measured train/val gap on the
    # production screen is 3.4x (train 0.0192, val 0.0650 at epoch 625), so there IS something here
    # to regularise — and `weight_decay` above, still 0.0, is the cheaper way to try first.
    dropout: 0.0
    # Batch norm on the hidden pre-activations. It changes the convergence badly enough that it
    # cannot be screened at the learning rate tuned without it — sweep the two JOINTLY or the
    # result is a statement about the rate, not about the normalisation.
    batch_norm: false
    # `none` is the constant rate everything so far was measured at. `cosine` decays to
    # learning_rate * lr_final_factor over the EPOCH CEILING, not over the epoch early stopping
    # reaches — a schedule whose shape depends on its own outcome is a feedback loop, not a setting.
    lr_schedule: none
    lr_final_factor: 0.01
    # Epochs the schedule spans; 0 = use `epochs`. `epochs` is a CEILING set far above any real
    # fit, so leaving this at 0 makes a cosine traverse only its flat first quarter — measured, it
    # cut the rate by 16% over a 533-epoch run and called itself an annealing schedule. Set it near
    # where the fit actually ends.
    lr_t_max: 0

  mlp2:
    type: torch_mlp
    enabled: true
    hidden_sizes: [512, 512]
    epochs: 2000
    patience: 100
    batch_size: 512
    learning_rate: 0.001
    weight_decay: 0.0
    seed: 2
    threads: 4
    device: cuda
    # Architecture, all handed to models.build_mlp. The OUTPUT layer is always linear and is not a
    # setting: the targets are scaled PCA coefficients with unbounded range, so a squashing head
    # would cap the tails of the distribution being regressed.
    #   relu  the baseline every number before 2026-08-14 was measured on
    #   gelu / silu  nonzero derivative on the negative side, so a dead unit can recover
    activation: relu
    # Share of hidden units zeroed during training. 0.0 is off. The measured train/val gap on the
    # production screen is 3.4x (train 0.0192, val 0.0650 at epoch 625), so there IS something here
    # to regularise — and `weight_decay` above, still 0.0, is the cheaper way to try first.
    dropout: 0.0
    # Batch norm on the hidden pre-activations. It changes the convergence badly enough that it
    # cannot be screened at the learning rate tuned without it — sweep the two JOINTLY or the
    # result is a statement about the rate, not about the normalisation.
    batch_norm: false
    # `none` is the constant rate everything so far was measured at. `cosine` decays to
    # learning_rate * lr_final_factor over the EPOCH CEILING, not over the epoch early stopping
    # reaches — a schedule whose shape depends on its own outcome is a feedback loop, not a setting.
    lr_schedule: none
    lr_final_factor: 0.01
    # Epochs the schedule spans; 0 = use `epochs`. `epochs` is a CEILING set far above any real
    # fit, so leaving this at 0 makes a cosine traverse only its flat first quarter — measured, it
